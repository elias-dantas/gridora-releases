name: Relatório Diário de Downloads

on:
  schedule:
    # Roda todos os dias às 09:00 UTC (06:00 no horário de Brasília)
    - cron: '0 9 * * *'
  # Permite rodar manualmente pela aba Actions para testar agora
  workflow_dispatch:

jobs:
  send-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar estatísticas de releases
        id: stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Gera um relatório em formato HTML simples para melhor visualização
          echo "<h2 style='font-family: Arial, sans-serif;'>📊 Relatório Diário de Downloads - Gridora</h2>" > report.html
          echo "<p style='font-family: Arial, sans-serif; color: #666;'>Data da consulta: $(date +%d/%m/%Y)</p>" >> report.html
          echo "<table style='border-collapse: collapse; width: 100%; font-family: Arial, sans-serif; margin-top: 10px;'>" >> report.html
          echo "<tr style='background-color: #f4f4f4;'><th style='padding: 8px; border: 1px solid #ddd; text-align: left;'>Versão</th><th style='padding: 8px; border: 1px solid #ddd; text-align: left;'>Data</th><th style='padding: 8px; border: 1px solid #ddd; text-align: left;'>Arquivo</th><th style='padding: 8px; border: 1px solid #ddd; text-align: center;'>Total Downloads</th></tr>" >> report.html

          # Consulta a API e formata cada release como uma linha da tabela
          gh api repos/${{ github.repository }}/releases --jq '.[] | "<tr><td style=\"padding: 8px; border: 1px solid #ddd;\">\(.tag_name)</td><td style=\"padding: 8px; border: 1px solid #ddd;\">\(.published_at[:10])</td><td style=\"padding: 8px; border: 1px solid #ddd;\">\(.assets[0].name // \"Sem arquivo\")</td><td style=\"padding: 8px; border: 1px solid #ddd; text-align: center; font-weight: bold;\">\(.assets[0].download_count // 0)</td></tr>"' >> report.html

          echo "</table>" >> report.html
          echo "<p style='font-family: Arial, sans-serif; color: #666; font-size: 12px; margin-top: 20px;'><em>Relatório gerado automaticamente pelo GitHub Actions.</em></p>" >> report.html

      - name: Enviar e-mail com o relatório
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com # Corrigido: era "://gmail.com" na pesquisa
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "📊 Downloads Gridora - ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: "Gridora Bot <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://report.html # Envia como HTML para renderizar a tabela