# ==============================================================================
# Gridora - Relatório Diário de Downloads
# Consulta a API do GitHub, gera report.html (tabela) e envia por e-mail.
# ==============================================================================
name: Daily Download Stats

on:
  schedule:
    # Todos os dias às 09:00 UTC (06:00 Brasília)
    - cron: '0 9 * * *'
  workflow_dispatch:   # botão "Run workflow" para testar agora

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar releases e gerar relatório HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES_JSON=$(gh api "repos/${{ github.repository }}/releases?per_page=100")
          TOTAL=$(echo "$RELEASES_JSON" | jq '[.[].assets[].download_count] | add // 0')

          {
            echo "<html><body style='font-family:Arial,sans-serif;'>"
            echo "<h2>📥 Downloads do Gridora — $(date -u +%d/%m/%Y)</h2>"
            echo "<p><strong>Total acumulado:</strong> ${TOTAL} downloads</p>"
            echo "<table border='1' cellpadding='8' style='border-collapse:collapse;'>"
            echo "<tr style='background:#1a1a2e;color:#fff;'><th>Release</th><th>Data</th><th>Arquivo</th><th>Downloads</th></tr>"
            echo "$RELEASES_JSON" | jq -r '.[] | . as $rel | .assets[] | "<tr><td>\($rel.tag_name)</td><td>\($rel.published_at[:10])</td><td>\(.name)</td><td>\(.download_count)</td></tr>"'
            echo "</table>"
            echo "<p style='color:#888;font-size:12px;'>Relatório automático — GitHub Actions</p>"
            echo "</body></html>"
          } > report.html

      - name: Enviar e-mail com o relatório
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "📥 Downloads Gridora - ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: "Gridora Bot <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://report.html